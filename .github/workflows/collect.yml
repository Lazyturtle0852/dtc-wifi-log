name: Collect WiFi clients

on:
  schedule:
    # Every 10 minutes, offset from :00 to avoid GitHub peak-load drops.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifi-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and append CSV
        env:
          WIFI_API_URL: ${{ vars.WIFI_API_URL || 'https://api.dtc.wide.ad.jp/crowd' }}
          WIFI_API_FORMAT: ${{ vars.WIFI_API_FORMAT || 'dtc_crowd' }}
        run: python src/fetch.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wifi_clients.csv
          if git diff --staged --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi
          git commit -m "data: wifi client snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
