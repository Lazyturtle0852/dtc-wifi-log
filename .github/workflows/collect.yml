name: Collect WiFi clients

on:
  schedule:
    # Backup seed only — GitHub schedule is best-effort and may not fire.
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Collect rounds (10 min apart). Default ~5.5h."
        required: false
        default: "33"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: wifi-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect every 10 minutes
        env:
          WIFI_API_URL: ${{ vars.WIFI_API_URL || 'https://api.dtc.wide.ad.jp/crowd' }}
          WIFI_API_FORMAT: ${{ vars.WIFI_API_FORMAT || 'dtc_crowd' }}
          ROUNDS: ${{ inputs.rounds || '33' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git_push_with_retry() {
            local attempt=1
            local max_attempts=5
            local delay=5
            while [ "${attempt}" -le "${max_attempts}" ]; do
              if git push 2>&1; then
                return 0
              fi
              echo "git push failed (attempt ${attempt}/${max_attempts}); rebasing and retrying in ${delay}s..."
              git pull --rebase origin main || true
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 3))
            done
            echo "git push failed after ${max_attempts} attempts."
            return 1
          }

          rounds="${ROUNDS}"
          echo "Running ${rounds} round(s)"
          for i in $(seq 1 "${rounds}"); do
            echo "::group::Round ${i}/${rounds} $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            if [ "${i}" -eq 1 ]; then
              python src/backfill_gaps.py || echo "backfill skipped due to error."
            fi
            if ! python src/fetch.py; then
              echo "fetch failed after retries; skipping this round."
            else
              python src/reshape_wide.py
              git add data/wifi_clients.csv data/wifi_clients_wide.csv
              if git diff --staged --quiet; then
                echo "No CSV changes to commit."
              else
                git commit -m "data: wifi client snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
                git_push_with_retry
              fi
            fi
            echo "::endgroup::"
            if [ "${i}" -lt "${rounds}" ]; then
              sleep 600
            fi
          done

      - name: Chain next window
        if: success()
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "WORKFLOW_DISPATCH_TOKEN is not set; cannot self-chain."
            exit 1
          fi
          gh workflow run collect.yml --repo "${GITHUB_REPOSITORY}"
          echo "Dispatched next collect window."
